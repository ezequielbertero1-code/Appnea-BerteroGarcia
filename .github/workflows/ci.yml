# Corre los tests unitarios, lint y detekt en cada push y pull request.
# Si algo falla, GitHub marca el commit/PR con una cruz roja y se puede ver el reporte.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Java para arrancar Gradle; el JDK de compilación lo descarga Gradle solo
      # (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # testDebugUnitTest corre en :app, :core:data y :core:ui; los módulos Kotlin puro usan "test"
      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest :core:model:test :core:domain:test

      - name: Lint
        run: ./gradlew lintDebug

      # Análisis estático de Kotlin de todos los módulos (config/detekt/). Falla solo por problemas nuevos.
      - name: Detekt
        run: ./gradlew detekt

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/tests/
            core/*/build/reports/tests/
            app/build/reports/lint-results-debug.html
            core/*/build/reports/lint-results-debug.html
            build/reports/detekt/
          if-no-files-found: ignore
